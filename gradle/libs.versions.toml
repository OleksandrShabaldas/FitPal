[versions]
agp = "8.7.3"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.28"
compose-bom = "2024.12.01"
room = "2.6.1"
hilt = "2.52"
camerax = "1.4.1"
navigation = "2.8.5"
lifecycle = "2.8.7"
coroutines = "1.9.0"
mediapipe = "0.10.35"
mlkit-barcode = "17.3.0"
coil = "2.7.0"
activity = "1.9.3"
core-ktx = "1.15.0"
haze = "1.2.0"
# --- Wear OS companion ---
# NOTE: these Wear / Tiles / ProtoLayout / WatchFace artifacts churn often. If Gradle can't
# resolve a version, bump it to the latest stable shown by Android Studio's catalog editor.
play-services-wearable = "18.2.0"
androidx-work = "2.9.1"
wear-compose = "1.4.1"
wear-input = "1.1.0"
wear-tiles = "1.4.1"
wear-protolayout = "1.2.1"
watchface = "1.2.1"
datastore = "1.1.1"
concurrent-futures = "1.2.0"
health-services = "1.0.0"

[libraries]
# Compose
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material-icons = { group = "androidx.compose.material", name = "material-icons-extended" }

# Navigation
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }

# Lifecycle
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }

# Room (local database)
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# Hilt (dependency injection)
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version = "1.2.0" }

# CameraX
camerax-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
camerax-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
camerax-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
camerax-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }

# MediaPipe — on-device multimodal LLM (Gemma 3n). tasks-genai = LLM engine,
# tasks-vision = the image classes (MPImage/BitmapImageBuilder) for vision input.
mediapipe-genai = { group = "com.google.mediapipe", name = "tasks-genai", version.ref = "mediapipe" }
mediapipe-vision = { group = "com.google.mediapipe", name = "tasks-vision", version.ref = "mediapipe" }

# ML Kit barcode scanning (bundled, offline detection)
mlkit-barcode = { group = "com.google.mlkit", name = "barcode-scanning", version.ref = "mlkit-barcode" }

# Coroutines
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
# Bridges Play Services Task<T> -> suspend await() (used by the Wearable Data Layer clients)
coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "coroutines" }

# Image loading
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }

# Haze — real frosted-glass background blur for the floating nav (offline rendering lib)
haze = { group = "dev.chrisbanes.haze", name = "haze", version.ref = "haze" }

# Android core
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity" }
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "core-ktx" }

# --- Wear OS companion ---
# Wearable Data Layer — phone <-> watch messaging + synced today-snapshot
play-services-wearable = { group = "com.google.android.gms", name = "play-services-wearable", version.ref = "play-services-wearable" }
# WorkManager — expedited background AI jobs kicked off from the watch (phone app may be dead)
androidx-work-runtime = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "androidx-work" }
# Wear Compose UI (replaces material3 on the watch)
wear-compose-material = { group = "androidx.wear.compose", name = "compose-material", version.ref = "wear-compose" }
wear-compose-foundation = { group = "androidx.wear.compose", name = "compose-foundation", version.ref = "wear-compose" }
wear-compose-navigation = { group = "androidx.wear.compose", name = "compose-navigation", version.ref = "wear-compose" }
# Wear input — RemoteInput helper for voice/keyboard text capture on the watch
wear-input = { group = "androidx.wear", name = "wear-input", version.ref = "wear-input" }
# Wear Tiles + ProtoLayout (the water quick-log tile)
wear-tiles = { group = "androidx.wear.tiles", name = "tiles", version.ref = "wear-tiles" }
wear-protolayout = { group = "androidx.wear.protolayout", name = "protolayout", version.ref = "wear-protolayout" }
wear-protolayout-material = { group = "androidx.wear.protolayout", name = "protolayout-material", version.ref = "wear-protolayout" }
# WatchFace complications (water quick-log + read-only calories-left)
wear-complications-datasource = { group = "androidx.wear.watchface", name = "watchface-complications-data-source-ktx", version.ref = "watchface" }
# DataStore — persist the last stats snapshot on the watch (for tiles/complications offline)
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
# CallbackToFutureAdapter — bridge the tile's coroutine snapshot read to a ListenableFuture
androidx-concurrent-futures = { group = "androidx.concurrent", name = "concurrent-futures-ktx", version.ref = "concurrent-futures" }
# Wear OS Health Services — read the watch's own daily step count (passive, battery-friendly)
health-services-client = { group = "androidx.health", name = "health-services-client", version.ref = "health-services" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
